# review-conventions.yml — the single source of truth for this repo's review rules.
#
# Everything below is compiled into tool-specific config files by
# `node scripts/sync-conventions.mjs`:
#
#   CLAUDE.md                            → Claude (claude-code-action)
#   .github/copilot-instructions.md      → GitHub Copilot code review
#   .github/instructions/*.instructions.md → Copilot path-scoped rules
#   .coderabbit.yaml                     → CodeRabbit (optional)
#
# Never edit the generated files by hand — CI fails on drift.
# The `severity` section is also read at runtime by the merge gate
# (scripts/review-gate.mjs) and the reviewer assigner (scripts/assign-reviewer.mjs).

version: 1

# ---------------------------------------------------------------------------
# Which tool configs `npm run sync` generates from this file.
#   claude     → CLAUDE.md (marked block)
#   agents     → AGENTS.md (marked block) — the cross-tool convention most
#                other AI reviewers/agents read (Codex, Cursor, Gemini, …)
#   copilot    → .github/copilot-instructions.md + .github/instructions/*
#   coderabbit → .coderabbit.yaml
# Remove a target you don't use; fully-generated files of a removed target are
# deleted on the next sync.
# ---------------------------------------------------------------------------
sync:
  targets: [claude, agents, copilot, coderabbit]

# ---------------------------------------------------------------------------
# Severity contract: every AI review comment must start with one of these tags.
# The merge gate blocks while any unresolved AI thread carries a `block_on` tag.
# Untagged AI comments are treated as `default` (tools don't always comply).
# ---------------------------------------------------------------------------
severity:
  tags: [blocker, warn, nit]
  default: warn
  block_on: [blocker]

# ---------------------------------------------------------------------------
# Merge-gate behavior.
#
# require_ai_review: fail the gate when NO configured AI reviewer has posted
#   anything on the PR. Without this the gate is fail-open: a reviewer that
#   dies silently (claude-code-action can exit 0 having posted nothing) is
#   indistinguishable from "no blockers found", and unreviewed code merges.
# recheck_label: GitHub does not expose thread resolution as an Actions
#   trigger, so resolving a thread cannot re-run the gate on its own. Replying
#   in a thread does re-run it; add/remove this label to force a re-run after a
#   bare resolve. See docs/configuration.md → Re-triggering the gate.
# fork_policy: fork PRs get a read-only token and no secrets, so AI review
#   cannot run there. "skip" passes the gate with an explanatory note and the
#   risk label (fork PRs then rely on human review); "block" fails instead.
# ---------------------------------------------------------------------------
gate:
  require_ai_review: true
  recheck_label: recheck-gate
  fork_policy: skip   # skip | block

# ---------------------------------------------------------------------------
# Blocker verification.
#
# A blocking tag is the reviewing model's own opinion, and models systematically
# rate findings more severe than humans do. Every AI review system that reaches
# usable precision adds a second stage rather than trusting the first pass.
#
# When enabled, each blocking finding gets a second, adversarial call that is
# asked to REFUTE it; only survivors hold the merge. Requires ANTHROPIC_API_KEY.
# Fails safe in every direction: a missing key, an API error, a refusal, or
# malformed output all leave the finding blocking.
#
# votes > 1 runs independent attempts and takes the majority — measurably more
# accurate, and linearly more expensive. Blockers should be rare, so 3 is
# affordable on most repos.
# ---------------------------------------------------------------------------
verification:
  enabled: true
  model: claude-opus-5
  votes: 1

# ---------------------------------------------------------------------------
# PR size.
#
# Review effectiveness runs 80–90% under ~200 changed lines and falls below 50%
# past ~1,000 — and large diffs degrade AI review too, since the reviewer's
# budget is spent before it reaches the risky part. Every team that reports a
# working AI-review process enforces a mechanical size limit.
#
# action: warn  → label only (default, so adopting this template never blocks
#                 an in-flight PR by surprise)
#         block → fail the gate. This is what the evidence actually supports;
#                 switch to it once your team has agreed on the threshold.
# max_* of 0 disables that check.
# ---------------------------------------------------------------------------
size:
  max_changed_lines: 800
  max_changed_files: 0
  action: warn        # warn | block
  label: oversized-pr
  exclude:            # generated and vendored files don't count toward size
    - "**/*.lock"
    - "**/package-lock.json"
    - "**/*.snap"
    - "**/generated/**"
    - "**/vendor/**"

# ---------------------------------------------------------------------------
# Review discipline — rendered into every AI reviewer's instructions.
#
# Volume is the most-cited reason teams abandon AI review: past some number of
# comments per PR, people start resolving without reading, and then the tool's
# CORRECT findings get ignored too. Hosted tools commonly land at 10–30 comments
# per PR; a well-tuned reviewer runs at ~1–2 findings per review.
#
# suppress is negative prompting: naming what NOT to flag works far better than
# asking for "high-signal comments". Asked to find problems, a model will invent
# them — so allow_no_findings makes an empty review an explicitly correct answer.
# ---------------------------------------------------------------------------
review:
  max_comments: 10
  require_evidence: true          # quote the offending line, or drop the finding
  allow_no_findings: true         # "nothing to flag" is a valid review
  blocker_requires_fix: true      # blockers must carry a concrete fix suggestion
  suppress:
    - >-
      Style, formatting, naming taste, or import ordering — a linter or
      formatter owns those, not a reviewer.
    - >-
      Theoretical risks that need preconditions the surrounding code makes
      unlikely or impossible.
    - >-
      Defense-in-depth suggestions where the primary defense is already present
      and adequate.
    - >-
      Restating what the code does, summarizing the diff, or praising it.
    - >-
      Speculative performance concerns with no measurement and no concrete
      input size.
    - >-
      Requests for tests, docs, or error handling on code paths this diff does
      not change.
    - >-
      Anything you cannot point at a specific changed line for.

# ---------------------------------------------------------------------------
# Which GitHub logins the gate treats as AI reviewers.
# "[bot]" suffixes are stripped and case is ignored before matching.
#
# ai_reviewers        participate in the severity contract: their findings can
#                     block the merge.
# advisory_reviewers  count as "a review happened" (so require_ai_review is
#                     satisfied) and show up in the summary, but can NEVER block
#                     regardless of tags or severity.default.
#
# Copilot belongs in advisory: GitHub documents that Copilot code review ignores
# instructions that change comment format, so it cannot be made to emit a
# severity tag — and its native High/Medium/Low severity is UI metadata that no
# API exposes. Leaving it gated would mean every Copilot comment inherits
# severity.default, which silently turns them all into blockers if you ever set
# that to a blocking tag.
# ---------------------------------------------------------------------------
ai_reviewers:
  - claude                          # Claude GitHub App
  - github-actions                  # claude-code-action posting via GITHUB_TOKEN
  - coderabbitai                    # CodeRabbit

advisory_reviewers:
  - copilot                         # GitHub Copilot code review
  - copilot-pull-request-reviewer

# ---------------------------------------------------------------------------
# Human reviewer assignment (runs only after the AI gate passes).
# pool:       GitHub usernames eligible for assignment. Leave empty to skip.
# count:      reviewers per normal PR. 0 disables human assignment entirely.
# risk_count: reviewers per risk-path PR (defaults to `count` if omitted).
# The pick is deterministic (PR number modulo pool size) so re-runs are stable.
# ---------------------------------------------------------------------------
reviewers:
  pool: []          # e.g. [alice, bob, carol]
  count: 1
  risk_count: 1     # e.g. 2 to require an extra pair of eyes on risky diffs
  risk_label: needs-human-review

  # strategy: how the reviewer is chosen from the pool.
  #   expertise — rank candidates by the criteria below. Default: people who
  #               actually touched the changed files, least-loaded first.
  #               Load-balancing *across everyone* backfires: authors scroll
  #               past an unqualified suggestion and pick someone else.
  #   rotation  — deterministic round robin (PR number modulo pool size).
  #               Ignores the criteria; use it only when the pool is small and
  #               interchangeable.
  strategy: expertise

  # criteria: the expertise strategy, tunable. These are the defaults — omit
  # the whole block to accept them.
  #   rank:         sort keys, applied in order. "load" = fewer open review
  #                 requests first; "expertise" = more recent commits to the
  #                 changed files first. Login breaks remaining ties, so
  #                 re-runs never reshuffle.
  #   availability: skip reviewers whose GitHub status is "busy" (dropped
  #                 rather than leaving the PR unassigned if everyone is busy).
  #   expertise_files:   sample the N largest changed files when scoring.
  #   expertise_commits: look back N commits per sampled file.
  criteria:
    rank: [load, expertise]
    availability: true
    expertise_files: 10
    expertise_commits: 30

# ---------------------------------------------------------------------------
# Risk tiering.
# risk_paths:   PRs touching these globs get `risk_label` and `risk_count`
#               reviewers from `risk_reviewers` (falling back to the pool).
#               Pair the label with a branch-protection rule to make human
#               review mandatory on these paths.
# exempt_paths: if EVERY changed file matches one of these globs (and none is
#               a risk path), the PR is AI-only — no human reviewer assigned.
# ---------------------------------------------------------------------------
risk_paths:
  - "**/migrations/**"
  - "**/payments/**"
  - "**/auth/**"
risk_reviewers: []   # e.g. [tech-lead]; falls back to the random pool if empty
exempt_paths: []     # e.g. ["docs/**", "**/*.md", "scripts/**"]

# ---------------------------------------------------------------------------
# The review rules themselves. `global` applies everywhere; each `scoped`
# entry applies to files matching its glob (Copilot gets these as
# .github/instructions/<name>.review.instructions.md with applyTo frontmatter).
# ---------------------------------------------------------------------------
rules:
  global:
    - >-
      Start every review comment with a severity tag as the first token:
      [blocker], [warn], or [nit]. Comments without a tag are treated as [warn].
    - >-
      [blocker] means the PR must not merge as-is: correctness bugs, security
      holes, data loss or corruption, breaking API changes, secrets in code.
    - >-
      [warn] means fix-worthy but mergeable: missing error handling on likely
      failure paths, misleading names, missing tests for changed behavior.
    - >-
      [nit] means style or preference. Never mark formatting, naming taste,
      or micro-optimizations higher than [nit].
    - >-
      Review the diff against the PR description. If the code does something
      the description does not mention (scope creep, drive-by changes), point
      it out as [warn].
    - >-
      When you suspect an N+1 query or unbounded loop over external data,
      ask for query logs or measurements rather than asserting.

  scoped:
    - name: migrations
      applyTo: "**/migrations/**"
      rules:
        - >-
          [blocker] any destructive operation (DROP, DELETE, column removal,
          type narrowing) unless the PR description states a rollback and
          backfill plan.
        - >-
          Check that the migration is reversible, or that irreversibility is
          explicitly acknowledged in the PR description.
        - >-
          Flag long-running migrations on large tables (full-table rewrites,
          non-concurrent index builds) as [warn] with a suggested safer path.

    - name: payments
      applyTo: "**/payments/**"
      rules:
        - >-
          [blocker] any retryable payment operation that is not idempotent
          (missing idempotency key, non-transactional state change).
        - >-
          [blocker] amounts handled as floating point. Money must be integer
          minor units or a decimal type.
        - >-
          Verify failure paths: what happens when the PG call times out after
          the charge succeeded? Ask if the reconciliation path is unclear.

    - name: auth
      applyTo: "**/auth/**"
      rules:
        - >-
          [blocker] tokens, passwords, or secrets logged, stored in plain
          text, or returned in API responses.
        - >-
          Check authorization, not just authentication: does every new
          endpoint verify the caller may act on the target resource?
