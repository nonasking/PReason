# The merge gate + reviewer assignment pipeline:
#
#   AI reviews land  →  gate blocks while a [blocker] thread is unresolved
#                    →  author fixes or rebuts, resolves the thread
#                    →  gate passes  →  one human reviewer is auto-assigned
#                       (risk paths escalate to the risk label / risk reviewer)
#
# Make "gate" a required status check in branch protection to enforce it.
#
# ── Why these triggers ──────────────────────────────────────────────────────
# `pull_request_review_thread` (resolved/unresolved) exists as a *webhook* but
# has never been added as an Actions trigger — the request has been open since
# March 2022. So resolving a thread cannot re-run this workflow on its own.
#
# What is covered instead:
#   pull_request_review_comment  → the author replies in a thread (the flow we
#                                  actually want: rebuttals are visible)
#   issue_comment                → the author comments on the PR
#   pull_request_review          → an AI reviewer submits a review with an App
#                                  token (the Claude/Copilot GitHub Apps)
#   workflow_run                 → the Claude review workflow finished. Needed
#                                  because events created with GITHUB_TOKEN do
#                                  NOT trigger workflows — a review posted that
#                                  way would otherwise never re-run the gate.
#   labeled / unlabeled          → manual re-run after a bare resolve
#   synchronize                  → a pushed fix
#
# For an exact re-run on thread resolution you need an external receiver
# subscribed to the pull_request_review_thread webhook that calls
# repository_dispatch back into this repo. See docs/configuration.md.

name: Review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Claude review"]
    types: [completed]
  repository_dispatch:
    types: [review-thread-changed]

concurrency:
  group: >-
    review-gate-${{ github.event.pull_request.number
      || github.event.issue.number
      || github.event.client_payload.pr_number
      || github.event.workflow_run.pull_requests[0].number
      || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    # issue_comment fires for issues too — only act on pull requests. A
    # workflow_run with no associated PR (e.g. a fork) has nothing to gate.
    # Closed PRs are the posthoc job's business, not the gate's.
    if: >-
      (github.event_name != 'issue_comment'
        || github.event.issue.pull_request != null)
      && (github.event_name != 'workflow_run'
        || github.event.workflow_run.pull_requests[0] != null)
      && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always run the gate's scripts and conventions from the default branch,
      # not the PR. On pull_request events the default checkout is the PR merge
      # ref — which would let a PR weaken review-conventions.yml or the gate
      # script and then pass its own weakened gate. Consequence: convention
      # changes take effect on the PRs *after* the one that merges them.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The scripts call the GitHub API with an env token; nothing here
          # runs git, so don't leave credentials in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Resolve PR number
        id: pr
        # Via env, never inline ${{ }} inside `run`: repository_dispatch
        # payloads are strings chosen by the caller, and inline interpolation
        # of one into a shell line is a script-injection vector.
        env:
          RAW_PR_NUMBER: >-
            ${{ github.event.pull_request.number
              || github.event.issue.number
              || github.event.client_payload.pr_number
              || github.event.workflow_run.pull_requests[0].number }}
        run: |
          if ! [[ "$RAW_PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Refusing non-numeric PR number: $RAW_PR_NUMBER" >&2
            exit 1
          fi
          echo "number=$RAW_PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check unresolved blocking AI comments
        run: node scripts/review-gate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Used to verify blocking findings before they hold the merge. When
          # absent, findings block unverified rather than passing unchecked.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Assign human reviewer
        run: node scripts/assign-reviewer.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}

  # When a PR merges with the hotfix label, the skipped review becomes a
  # tracked issue — the bypass defers review, it does not erase it.
  posthoc:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Open post-hoc review issue if the hotfix bypass was used
        run: node scripts/posthoc-hotfix.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
