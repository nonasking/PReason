# Repository CI for the pipeline itself.
#
#   1. Unit tests for the logic the gate and assigner depend on — severity
#      parsing, glob matching, finding fingerprints, config validation.
#   2. Convention-as-code enforcement: the generated tool configs (CLAUDE.md
#      block, copilot-instructions.md block, .github/instructions/*,
#      .coderabbit.yaml) must match review-conventions.yml. Editing a generated
#      file without updating the source — or vice versa — fails here.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Generated configs are in sync
        run: node scripts/sync-conventions.mjs --check
