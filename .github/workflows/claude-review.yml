# AI first-pass review with Claude, following review-conventions.yml.
# Requires the ANTHROPIC_API_KEY repository secret.
#
# Copilot code review can run alongside this (enable it in repo settings /
# rulesets); both read the same conventions via their generated config files,
# and the review gate treats both the same way.

name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  actions: read

jobs:
  review:
    # Fork PRs receive a read-only token and no secrets, so this job cannot run
    # there at all. The gate handles forks explicitly (gate.fork_policy).
    if: >-
      !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Reviews have been reported hanging to the 6-hour Actions cap; bound them
    # so a stuck review fails fast instead of pinning a required check.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # the review reads the diff via `gh pr diff`, not git history

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Reviews are biased by existing comments — including the reviewer's
          # own earlier ones and the rebuttal threads this pipeline produces.
          # Exclude bot comments so each run judges the code, not the argument.
          exclude_comments_by_actor: "*[bot]"
          # Model is deliberately pinned here so cost measurement is stable.
          # Swap to a cheaper model (e.g. claude-haiku-4-5) for low-risk repos.
          # --max-turns caps exploration, which is the main cost driver.
          # `gh pr comment` is required: on a clean PR the model must be able to
          # post its "nothing to flag" summary, or the gate's fail-closed check
          # cannot tell a clean review from a reviewer that died silently.
          claude_args: '--model claude-opus-5 --max-turns 30 --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"'
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}.

            Follow the "Code review conventions" section of CLAUDE.md exactly —
            in particular the severity contract: every comment you leave MUST
            start with [blocker], [warn], or [nit] as its first token.

            Use `gh pr diff` and `gh pr view` to read the change, then leave
            inline comments with mcp__github_inline_comment__create_inline_comment.
            Only comment where something should change or a genuine question
            exists. If nothing warrants a comment, leave a single summary
            comment saying so. Do not approve, request changes, or merge.
