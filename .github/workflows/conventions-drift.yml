# Convention-as-code enforcement: the generated tool configs (CLAUDE.md block,
# copilot-instructions.md block, .github/instructions/*, .coderabbit.yaml) must
# match review-conventions.yml. Editing a generated file without updating the
# source — or vice versa — fails this check.

name: Conventions drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/sync-conventions.mjs --check
